<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разработка приложений с Kotlin Multiplatform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <div class="container">
            <h1>Разработка приложений с kotlin multiplatform</h1>
        </div>
    </header>

    <main class="container">
        <section class="apps-section">
            <article class="app-card">
                <div class="app-header">
                    <img src="apps/time_measurer/app_icon.svg" alt="TimeMeasurer" class="app-icon">
                    <div class="app-info">
                        <h3 class="app-name">TimeMeasurer</h3>
                        <p class="app-description">
                            Инструмент для измерения и анализа времени.
                        </p>
                    </div>
                </div>

                <div class="app-frame">
                    <iframe src="apps/time_measurer/index.html" title="TimeMeasurer" loading="lazy"></iframe>
                </div>

                <div class="app-actions">
                    <a href="#" class="store-button rustore" aria-label="Скачать в RuStore">
                        <svg class="store-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <path d="M9 9l3 3-3 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>RuStore</span>
                    </a>

                    <a href="#" class="store-button appgallery" aria-label="Скачать в AppGallery">
                        <svg class="store-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        <span>AppGallery</span>
                    </a>

                    <a href="#" class="store-button desktop" aria-label="Скачать для macOS">
                        <svg class="store-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18.7 8.6c-.1-1.8 1.5-2.7 1.5-2.7-.8-1.1-2.1-1.3-2.6-1.3-1.1-.1-2.2.7-2.7.7-.6 0-1.5-.6-2.4-.6C10.3 4.7 8 6.8 8 10c0 .9.2 1.8.5 2.6.4 1.1 1.7 3.8 3.9 3.8 1.1 0 1.9-.8 2.7-.8.8 0 1.5.8 2.6.8 2.4 0 3.4-2.3 3.8-3.4-2.4-1.1-2.8-4-2.8-4.4z"/>
                            <path d="M15.8 3.5c.6-.8.9-1.8.8-2.8-1 .1-2.1.7-2.8 1.5-.6.7-.9 1.6-.8 2.5 1.1 0 2.1-.5 2.8-1.2z"/>
                        </svg>
                        <span>macOS</span>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Kotlin Multiplatform Developer</p>
        </div>
    </footer>
</body>
</html>
